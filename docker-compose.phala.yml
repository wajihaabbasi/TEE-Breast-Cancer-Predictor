services:
  backend:
    image: wajiabb/bc-backend:latest
    container_name: breast-cancer-backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

  frontend:
    image: wajiabb/bc-frontend:latest
    container_name: breast-cancer-frontend
    ports:
      - "7860:7860"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
